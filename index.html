<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LealApp</title>
    
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#4c51bf">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Segoe UI, sans-serif; }
        body { background: linear-gradient(135deg, #667eea, #764ba2); min-height:100vh; }
        .container { max-width:1000px; margin:20px auto; padding:15px; }
        .login-screen, .app-screen { background:white; border-radius:20px; box-shadow:0 15px 35px rgba(0,0,0,0.2); overflow:hidden; }
        .header { background:#4c51bf; color:white; padding:15px 20px; text-align:center; position:relative; }
        .logout-btn { position:absolute; right:15px; top:12px; background:rgba(255,255,255,0.25); border:none; color:white; padding:6px 12px; border-radius:6px; font-size:13px; cursor:pointer; }
        .nav { display:flex; background:#f1f5f9; }
        .nav-button { flex:1; padding:18px; border:none; font-size:16px; font-weight:600; color:#334155; }
        .nav-button.active { background:white; color:#4c51bf; border-bottom:4px solid #4c51bf; }
        .content { padding:25px; }
        input, button { width:100%; padding:14px; margin:10px 0; border:1px solid #cbd5e1; border-radius:10px; font-size:16px; }
        button { background:#4c51bf; color:white; font-weight:bold; cursor:pointer; }
        button:hover { background:#3730a3; }
        .btn-escanear { background:#10b981; font-size:18px; padding:18px; margin:15px 0; }
        .btn-secundario { background:#64748b; }
        .btn-danger { background:#ef4444; }
        .cliente-card { background:#f8fafc; padding:18px; border-radius:12px; margin-bottom:12px; border-left:5px solid #4c51bf; cursor:pointer; }
        .cliente-card:hover { background:#e0e7ff; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:25px; border-radius:20px; width:90%; max-width:420px; max-height:90vh; overflow:auto; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="container" id="loginScreen">
        <div class="login-screen">
            <div class="header"><h1>LealApp</h1><p>Administrador</p></div>
            <div class="content">
                <h2 style="text-align:center; margin:20px 0;">Iniciar Sesión</h2>
                <input type="text" id="username" placeholder="Usuario" value="admin">
                <input type="password" id="password" placeholder="Contraseña" value="1234">
                <button onclick="login()">Entrar</button>
                <p style="text-align:center; margin-top:15px; color:#666;">admin / 1234</p>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div class="container" id="appScreen" style="display:none;">
        <div class="app-screen">
            <div class="header">
                <h1>LealApp</h1>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>
            
            <div class="nav">
                <button class="nav-button active" onclick="showSection(0)">➕ Nuevo</button>
                <button class="nav-button" onclick="showSection(1)">👥 Ver Clientes</button>
                <button class="nav-button" onclick="showSection(2)">📱 Agregar Puntos</button>
            </div>

            <!-- Nuevo Cliente -->
            <div id="section0" class="content">
                <h2>Nuevo Cliente</h2>
                <input type="text" id="nombre" placeholder="Nombre">
                <input type="text" id="apellido" placeholder="Apellido">
                <input type="tel" id="celular" placeholder="Número de celular">
                <input type="text" id="apodo" placeholder="Apodo (opcional)">
                <button onclick="crearCliente()">Crear Cliente</button>
            </div>

            <!-- Ver Clientes -->
            <div id="section1" class="content" style="display:none;">
                <h2>Clientes (<span id="totalClientes">0</span>)</h2>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <button onclick="exportarClientes()" class="btn-secundario">📤 Exportar</button>
                    <button onclick="document.getElementById('importFile').click()" class="btn-secundario">📥 Importar</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importarClientes(event)">
                <input type="text" id="buscar" placeholder="Buscar..." onkeyup="filtrarClientes()">
                <div id="listaClientes"></div>
            </div>

            <!-- Agregar Puntos -->
            <div id="section2" class="content" style="display:none;">
                <h2>Agregar Puntos</h2>
                <button onclick="abrirEscanerNativo()" class="btn-escanear">📷 Escanear QR con Cámara</button>
                <p style="text-align:center; margin:20px 0; color:#555;">Escanea el QR y busca el cliente abajo</p>
                <input type="text" id="buscarManual" placeholder="Nombre, apellido o código..." onkeyup="buscarManual()">
                <div id="resultadosManual"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modalDetalle" class="modal">
        <div class="modal-content">
            <h2 id="modalNombre"></h2>
            <p><strong>Código:</strong> <span id="modalCodigo" style="font-size:1.8em; color:#4c51bf;"></span></p>
            <p id="modalInfo"></p>
            <div style="text-align:center; margin:20px 0;">
                <div id="modalQR"></div>
                <button onclick="descargarQR()" style="margin-top:10px; background:#10b981;">⬇️ Descargar QR</button>
            </div>
            <p>Puntos actuales: <strong id="modalPuntos" style="font-size:1.3em; color:#10b981;"></strong></p>
            <input type="number" id="puntosInput" placeholder="Cantidad para agregar" value="10">
            <button onclick="agregarPuntosModal()">➕ Agregar Puntos</button>
            <button onclick="reclamarPuntosModal()" style="background:#f59e0b;">🎁 Reclamar Puntos</button>
            <button onclick="cerrarModal()" style="background:#6b7280;">Cerrar</button>
            <button onclick="eliminarCliente()" class="btn-danger">🗑️ Eliminar Cliente</button>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('clientesLealApp')) || [];
        let clienteActual = null;

        function login() {
            if (document.getElementById('username').value === "admin" && document.getElementById('password').value === "1234") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'block';
                showSection(1);
            } else alert("Usuario o contraseña incorrectos");
        }

        function logout() {
            if (confirm("¿Cerrar sesión?")) {
                document.getElementById('appScreen').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'block';
            }
        }

        function generarCodigo() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let codigo = "";
            for (let i = 0; i < 4; i++) codigo += chars[Math.floor(Math.random() * chars.length)];
            return clientes.some(c => c.codigo === codigo) ? generarCodigo() : codigo;
        }

        function getQRContent(c) { return `${c.celular}-${c.codigo}`; }

        function crearCliente() {
            const nombre = document.getElementById('nombre').value.trim();
            const apellido = document.getElementById('apellido').value.trim();
            const celular = document.getElementById('celular').value.trim();
            if (!nombre || !apellido || !celular) return alert("Nombre, Apellido y Celular son obligatorios");

            const nuevo = {
                id: Date.now().toString(36),
                codigo: generarCodigo(),
                nombre, apellido, celular,
                apodo: document.getElementById('apodo').value.trim(),
                puntos: 0,
                reclamados: 0
            };

            clientes.unshift(nuevo);
            localStorage.setItem('clientesLealApp', JSON.stringify(clientes));
            alert(`✅ Cliente creado!\nCódigo: ${nuevo.codigo}`);
            limpiarFormularioNuevo();
            showSection(1);
        }

        function limpiarFormularioNuevo() {
            document.getElementById('nombre').value = '';
            document.getElementById('apellido').value = '';
            document.getElementById('celular').value = '';
            document.getElementById('apodo').value = '';
        }

        function showSection(n) {
            document.querySelectorAll('.nav-button').forEach((b,i) => b.classList.toggle('active', i===n));
            for(let i=0; i<3; i++) {
                const s = document.getElementById('section'+i);
                if(s) s.style.display = (i===n) ? 'block' : 'none';
            }
            if(n===1) cargarClientes();
        }

        function cargarClientes(filtrados = null) {
            const lista = document.getElementById('listaClientes');
            lista.innerHTML = '';
            document.getElementById('totalClientes').textContent = clientes.length;

            const array = filtrados || [...clientes].sort((a,b) => a.apellido.localeCompare(b.apellido));
            array.forEach(c => {
                const div = document.createElement('div');
                div.className = 'cliente-card';
                div.innerHTML = `<strong>${c.apellido}, ${c.nombre}</strong><br><span style="color:#4c51bf;font-weight:bold;">${c.codigo}</span> | 📱 ${c.celular}<br>⭐ Puntos: <strong>${c.puntos}</strong>`;
                div.onclick = () => abrirDetalle(c);
                lista.appendChild(div);
            });
        }

        function filtrarClientes() {
            const term = document.getElementById('buscar').value.toUpperCase().trim();
            const filtrados = clientes.filter(c => 
                c.nombre.toUpperCase().includes(term) || c.apellido.toUpperCase().includes(term) || (c.codigo && c.codigo.includes(term))
            );
            cargarClientes(filtrados);
        }

        function abrirDetalle(cliente) {
            clienteActual = cliente;
            document.getElementById('modalNombre').textContent = `${cliente.nombre} ${cliente.apellido}`;
            document.getElementById('modalCodigo').textContent = cliente.codigo;
            document.getElementById('modalInfo').innerHTML = `📱 ${cliente.celular} ${cliente.apodo ? `(${cliente.apodo})` : ''}`;
            document.getElementById('modalPuntos').textContent = cliente.puntos;

            const qrDiv = document.getElementById('modalQR');
            qrDiv.innerHTML = '';
            new QRCode(qrDiv, { text: getQRContent(cliente), width: 220, height: 220, colorDark: "#4c51bf" });

            document.getElementById('modalDetalle').style.display = 'flex';
        }

        function descargarQR() {
            const canvas = document.querySelector('#modalQR canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.download = `${clienteActual.codigo}.png`;
                link.href = canvas.toDataURL();
                link.click();
            }
        }

        function cerrarModal() { document.getElementById('modalDetalle').style.display = 'none'; }

        function agregarPuntosModal() {
            if (!clienteActual) return;
            const pts = parseInt(document.getElementById('puntosInput').value) || 0;
            if (pts <= 0) return alert("Ingresa cantidad mayor a 0");
            clienteActual.puntos += pts;
            localStorage.setItem('clientesLealApp', JSON.stringify(clientes));
            document.getElementById('modalPuntos').textContent = clienteActual.puntos;
            alert(`✅ Se agregaron ${pts} puntos`);
            cargarClientes();
        }

        function reclamarPuntosModal() {
            if (!clienteActual) return;
            const max = clienteActual.puntos;
            if (max <= 0) return alert("No tiene puntos");
            const pts = parseInt(prompt(`¿Cuántos puntos deseas reclamar?\nDisponible: ${max}`, "10"));
            if (!pts || pts <= 0 || pts > max) return;
            clienteActual.puntos -= pts;
            clienteActual.reclamados = (clienteActual.reclamados || 0) + pts;
            localStorage.setItem('clientesLealApp', JSON.stringify(clientes));
            document.getElementById('modalPuntos').textContent = clienteActual.puntos;
            alert(`🎁 Se reclamaron ${pts} puntos`);
            cargarClientes();
        }

        function eliminarCliente() {
            if (confirm(`¿Eliminar a ${clienteActual.nombre} ${clienteActual.apellido}?`)) {
                clientes = clientes.filter(c => c.id !== clienteActual.id);
                localStorage.setItem('clientesLealApp', JSON.stringify(clientes));
                cerrarModal();
                cargarClientes();
            }
        }

        function exportarClientes() {
            if (clientes.length === 0) return alert("No hay clientes");
            const link = document.createElement('a');
            link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(clientes, null, 2));
            link.download = `lealapp_clientes_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
        }

        function importarClientes(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (confirm(`Importar ${imported.length} clientes?`)) {
                        clientes = imported;
                        localStorage.setItem('clientesLealApp', JSON.stringify(clientes));
                        alert("Importado correctamente");
                        cargarClientes();
                    }
                } catch(err) { alert("Archivo inválido"); }
            };
            reader.readAsText(file);
        }

        function buscarManual() {
            const term = document.getElementById('buscarManual').value.toUpperCase().trim();
            const div = document.getElementById('resultadosManual');
            div.innerHTML = '';
            if (term.length < 2) return;
            clientes.filter(c => 
                c.nombre.toUpperCase().includes(term) || c.apellido.toUpperCase().includes(term) || (c.codigo && c.codigo.includes(term))
            ).forEach(c => {
                const btn = document.createElement('button');
                btn.style.margin = "8px 0";
                btn.textContent = `${c.codigo} - ${c.apellido}, ${c.nombre} (${c.puntos} pts)`;
                btn.onclick = () => abrirDetalle(c);
                div.appendChild(btn);
            });
        }

        function abrirEscanerNativo() {
            alert("📱 Abre la app 'Cámara' o 'Escáner de QR' de tu dispositivo.\n\nEscanea el QR y luego busca el cliente con su código de 4 dígitos.");
        }

        window.onload = () => {};
    </script>
</body>
</html>
