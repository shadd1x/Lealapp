<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LealApp PRO MAX</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4338ca">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:linear-gradient(135deg,#4338ca,#7c3aed,#2563eb);
min-height:100vh;
padding:10px;
color:#111827;
}

.container{
max-width:1100px;
margin:auto;
}

.screen{
background:rgba(255,255,255,0.96);
backdrop-filter:blur(10px);
border-radius:25px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,0.25);
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.header{
background:linear-gradient(90deg,#4338ca,#6366f1);
padding:20px;
color:white;
text-align:center;
position:relative;
}

.logout-btn{
position:absolute;
right:15px;
top:15px;
background:rgba(255,255,255,0.2);
border:none;
color:white;
padding:8px 14px;
border-radius:10px;
cursor:pointer;
}

.nav{
display:flex;
overflow:auto;
background:#eef2ff;
}

.nav button{
flex:1;
min-width:130px;
padding:16px;
border:none;
background:none;
font-weight:700;
font-size:15px;
cursor:pointer;
color:#334155;
}

.nav button.active{
background:white;
color:#4338ca;
border-bottom:4px solid #4338ca;
}

.content{
padding:20px;
}

input,button,select{
width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
border:1px solid #cbd5e1;
font-size:16px;
}

button{
background:#4338ca;
color:white;
font-weight:bold;
border:none;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.01);
}

.btn-green{background:#10b981;}
.btn-orange{background:#f59e0b;}
.btn-red{background:#ef4444;}
.btn-gray{background:#64748b;}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.08);
text-align:center;
}

.stat-card h3{
font-size:14px;
color:#64748b;
margin-bottom:10px;
}

.stat-card p{
font-size:28px;
font-weight:bold;
color:#4338ca;
}

.cliente-card{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 8px 18px rgba(0,0,0,0.06);
border-left:6px solid #4338ca;
cursor:pointer;
}

.cliente-card:hover{
background:#eef2ff;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
justify-content:center;
align-items:center;
z-index:9999;
padding:10px;
}

.modal-content{
background:white;
width:100%;
max-width:430px;
max-height:95vh;
overflow:auto;
padding:22px;
border-radius:25px;
animation:fadeIn .25s ease;
}

#reader{
width:100%;
margin-top:15px;
}

.mov-item{
background:#f8fafc;
padding:10px;
border-radius:10px;
margin-bottom:8px;
font-size:14px;
}

.badge-premio{
background:#10b981;
color:white;
padding:6px 12px;
border-radius:20px;
display:inline-block;
font-size:13px;
margin-top:8px;
}

@media(max-width:700px){
.cards{
grid-template-columns:repeat(2,1fr);
}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="container" id="loginScreen">
<div class="screen">
<div class="header">
<h1>LealApp PRO MAX</h1>
<p>Panel Administrador</p>
</div>
<div class="content">
<h2 style="text-align:center;margin:20px 0;">Iniciar Sesión</h2>
<input type="text" id="username" placeholder="Usuario" value="admin">
<input type="password" id="password" placeholder="Contraseña" value="1234">
<button onclick="login()">Entrar</button>
</div>
</div>
</div>

<!-- APP -->
<div class="container" id="appScreen" style="display:none;">
<div class="screen">

<div class="header">
<h1>LealApp PRO MAX</h1>
<button class="logout-btn" onclick="logout()">Salir</button>
</div>

<div class="nav">
<button class="active" onclick="showSection(0)">📊 Dashboard</button>
<button onclick="showSection(1)">➕ Nuevo</button>
<button onclick="showSection(2)">👥 Clientes</button>
<button onclick="showSection(3)">📷 Escanear</button>
<button onclick="showSection(4)">💾 Backup</button>
</div>

<!-- DASHBOARD -->
<div class="content" id="section0">
<div class="cards">
<div class="stat-card"><h3>Total Clientes</h3><p id="stClientes">0</p></div>
<div class="stat-card"><h3>Puntos Entregados</h3><p id="stEntregados">0</p></div>
<div class="stat-card"><h3>Puntos Reclamados</h3><p id="stReclamados">0</p></div>
<div class="stat-card"><h3>Clientes Premio</h3><p id="stPremio">0</p></div>
</div>

<h3 style="margin:20px 0;">🏆 Top Clientes</h3>
<div id="topClientes"></div>
</div>

<!-- NUEVO -->
<div class="content" id="section1" style="display:none;">
<h2>Registrar Nuevo Cliente</h2>
<input type="text" id="nombre" placeholder="Nombre">
<input type="text" id="apellido" placeholder="Apellido">
<input type="tel" id="celular" placeholder="Celular">
<input type="text" id="apodo" placeholder="Apodo opcional">
<button onclick="crearCliente()">Crear Cliente</button>
</div>

<!-- CLIENTES -->
<div class="content" id="section2" style="display:none;">
<h2>Listado de Clientes (<span id="totalClientes">0</span>)</h2>
<input type="text" id="buscar" placeholder="Buscar por nombre, apellido o código..." onkeyup="filtrarClientes()">
<div id="listaClientes"></div>
</div>

<!-- ESCANEAR -->
<div class="content" id="section3" style="display:none;">
<h2>Escanear QR Cliente</h2>
<button class="btn-green" onclick="iniciarEscaner()">📷 Iniciar Cámara</button>
<div id="reader"></div>
<input type="text" id="buscarManual" placeholder="o buscar manual..." onkeyup="buscarManual()">
<div id="resultadosManual"></div>
</div>

<!-- BACKUP -->
<div class="content" id="section4" style="display:none;">
<h2>Respaldo de Datos</h2>
<button class="btn-gray" onclick="exportarClientes()">📤 Exportar Base de Datos</button>
<button class="btn-gray" onclick="document.getElementById('importFile').click()">📥 Importar Base de Datos</button>
<input type="file" id="importFile" accept=".json" style="display:none;" onchange="importarClientes(event)">
</div>

</div>
</div>

<!-- MODAL CLIENTE -->
<div class="modal" id="modalDetalle">
<div class="modal-content">
<h2 id="modalNombre"></h2>
<p style="margin:10px 0;">Código: <strong id="modalCodigo" style="font-size:26px;color:#4338ca;"></strong></p>
<p id="modalInfo"></p>
<div id="premioAviso"></div>

<div style="text-align:center;margin:20px 0;">
<div id="modalQR"></div>
<button class="btn-green" onclick="descargarQR()">⬇ Descargar QR</button>
</div>

<p>Puntos Actuales: <strong id="modalPuntos" style="font-size:24px;color:#10b981;"></strong></p>

<input type="number" id="puntosInput" value="10" placeholder="Puntos">
<button onclick="agregarPuntosModal()">➕ Agregar Puntos</button>
<button class="btn-orange" onclick="reclamarPuntosModal()">🎁 Reclamar Puntos</button>

<h3 style="margin-top:20px;">🕓 Historial</h3>
<div id="historialMov"></div>

<button class="btn-red" onclick="eliminarCliente()">🗑 Eliminar Cliente</button>
<button class="btn-gray" onclick="cerrarModal()">Cerrar</button>
</div>
</div>

<script>

let clientes = JSON.parse(localStorage.getItem('clientesLealAppPro')) || [];
let clienteActual = null;
let scannerActivo = null;

function guardarDatos(){
    localStorage.setItem('clientesLealAppPro', JSON.stringify(clientes));
    actualizarDashboard();
}

function login(){
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();

    if(u === "admin" && p === "1234"){
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        actualizarDashboard();
        cargarClientes();
    }else{
        alert("Usuario o contraseña incorrectos");
    }
}

function logout(){
    if(confirm("¿Cerrar sesión?")){
        document.getElementById('appScreen').style.display='none';
        document.getElementById('loginScreen').style.display='block';
        detenerEscaner();
    }
}

function showSection(n){
    document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n));
    for(let i=0;i<5;i++){
        document.getElementById('section'+i).style.display = i===n ? 'block' : 'none';
    }
    if(n===0) actualizarDashboard();
    if(n===2) cargarClientes();
    if(n!==3) detenerEscaner();
}

function generarCodigo(){
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let codigo = "";
    for(let i=0;i<4;i++){
        codigo += chars[Math.floor(Math.random()*chars.length)];
    }
    return clientes.some(c=>c.codigo===codigo) ? generarCodigo() : codigo;
}

function getQRContent(c){
    return `${c.celular}-${c.codigo}`;
}

function crearCliente(){
    const nombre = document.getElementById('nombre').value.trim();
    const apellido = document.getElementById('apellido').value.trim();
    const celular = document.getElementById('celular').value.trim();
    const apodo = document.getElementById('apodo').value.trim();

    if(!nombre || !apellido || !celular){
        return alert("Completa Nombre, Apellido y Celular");
    }

    const nuevo = {
        id: Date.now().toString(36),
        codigo: generarCodigo(),
        nombre,
        apellido,
        celular,
        apodo,
        puntos:0,
        reclamados:0,
        creado:new Date().toLocaleString(),
        movimientos:[]
    };

    clientes.unshift(nuevo);
    guardarDatos();

    alert("✅ Cliente creado con código: "+nuevo.codigo);

    document.getElementById('nombre').value='';
    document.getElementById('apellido').value='';
    document.getElementById('celular').value='';
    document.getElementById('apodo').value='';

    showSection(2);
}

function cargarClientes(listaFiltrada=null){
    const lista = document.getElementById('listaClientes');
    lista.innerHTML = '';

    const arr = listaFiltrada || [...clientes].sort((a,b)=>a.apellido.localeCompare(b.apellido));
    document.getElementById('totalClientes').textContent = clientes.length;

    arr.forEach(c=>{
        const div = document.createElement('div');
        div.className = 'cliente-card';
        div.innerHTML = `
            <strong>${c.apellido}, ${c.nombre}</strong><br>
            <span style="color:#4338ca;font-weight:bold;">${c.codigo}</span> | 📱 ${c.celular}<br>
            ⭐ ${c.puntos} puntos
        `;
        div.onclick = ()=>abrirDetalle(c);
        lista.appendChild(div);
    });
}

function filtrarClientes(){
    const t = document.getElementById('buscar').value.toUpperCase().trim();
    const filtrados = clientes.filter(c =>
        c.nombre.toUpperCase().includes(t) ||
        c.apellido.toUpperCase().includes(t) ||
        c.codigo.includes(t)
    );
    cargarClientes(filtrados);
}

function abrirDetalle(cliente){
    clienteActual = cliente;

    document.getElementById('modalNombre').textContent = cliente.nombre+" "+cliente.apellido;
    document.getElementById('modalCodigo').textContent = cliente.codigo;
    document.getElementById('modalInfo').innerHTML = `📱 ${cliente.celular} ${cliente.apodo ? '('+cliente.apodo+')':''}<br>📅 Creado: ${cliente.creado}`;
    document.getElementById('modalPuntos').textContent = cliente.puntos;

    document.getElementById('premioAviso').innerHTML = cliente.puntos >= 100 ? `<div class="badge-premio">🎉 Cliente apto para premio</div>` : '';

    const qr = document.getElementById('modalQR');
    qr.innerHTML = '';
    new QRCode(qr,{
        text:getQRContent(cliente),
        width:220,
        height:220,
        colorDark:"#4338ca"
    });

    cargarHistorial(cliente);

    document.getElementById('modalDetalle').style.display='flex';
}

function cargarHistorial(cliente){
    const h = document.getElementById('historialMov');
    h.innerHTML = '';

    if(cliente.movimientos.length===0){
        h.innerHTML = '<p>Sin movimientos aún</p>';
        return;
    }

    [...cliente.movimientos].reverse().forEach(m=>{
        const div = document.createElement('div');
        div.className = 'mov-item';
        div.innerHTML = `${m.fecha}<br>${m.tipo==='suma'?'➕ Sumó':'🎁 Reclamó'} ${m.puntos} puntos`;
        h.appendChild(div);
    });
}

function cerrarModal(){
    document.getElementById('modalDetalle').style.display='none';
}

function agregarPuntosModal(){
    const pts = parseInt(document.getElementById('puntosInput').value)||0;
    if(pts<=0) return alert("Cantidad inválida");

    clienteActual.puntos += pts;
    clienteActual.movimientos.push({
        tipo:'suma',
        puntos:pts,
        fecha:new Date().toLocaleString()
    });

    guardarDatos();
    abrirDetalle(clienteActual);
    cargarClientes();
    alert("✅ "+pts+" puntos agregados");
}

function reclamarPuntosModal(){
    if(clienteActual.puntos<=0) return alert("No tiene puntos");

    const pts = parseInt(prompt("¿Cuántos puntos reclamar?",10));
    if(!pts || pts<=0 || pts>clienteActual.puntos) return;

    clienteActual.puntos -= pts;
    clienteActual.reclamados += pts;
    clienteActual.movimientos.push({
        tipo:'reclamo',
        puntos:pts,
        fecha:new Date().toLocaleString()
    });

    guardarDatos();
    abrirDetalle(clienteActual);
    cargarClientes();
    alert("🎁 "+pts+" puntos reclamados");
}

function eliminarCliente(){
    if(confirm("¿Eliminar este cliente?")){
        clientes = clientes.filter(c=>c.id!==clienteActual.id);
        guardarDatos();
        cerrarModal();
        cargarClientes();
    }
}

function descargarQR(){
    const canvas = document.querySelector('#modalQR canvas');
    if(canvas){
        const a = document.createElement('a');
        a.href = canvas.toDataURL();
        a.download = clienteActual.codigo+'.png';
        a.click();
    }
}

function actualizarDashboard(){
    document.getElementById('stClientes').textContent = clientes.length;

    let entregados = 0;
    let reclamados = 0;
    let premio = 0;

    clientes.forEach(c=>{
        entregados += c.movimientos.filter(m=>m.tipo==='suma').reduce((a,b)=>a+b.puntos,0);
        reclamados += c.reclamados || 0;
        if(c.puntos>=100) premio++;
    });

    document.getElementById('stEntregados').textContent = entregados;
    document.getElementById('stReclamados').textContent = reclamados;
    document.getElementById('stPremio').textContent = premio;

    const top = [...clientes].sort((a,b)=>b.puntos-a.puntos).slice(0,5);
    const div = document.getElementById('topClientes');
    div.innerHTML='';

    top.forEach(c=>{
        div.innerHTML += `<div class="cliente-card">${c.nombre} ${c.apellido}<br>⭐ ${c.puntos} pts</div>`;
    });
}

function exportarClientes(){
    const blob = new Blob([JSON.stringify(clientes,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lealapp_backup_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
}

function importarClientes(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(ev){
        try{
            const data = JSON.parse(ev.target.result);
            if(confirm("Importar "+data.length+" clientes?")){
                clientes = data;
                guardarDatos();
                cargarClientes();
                alert("✅ Base importada");
            }
        }catch{
            alert("Archivo inválido");
        }
    };
    reader.readAsText(file);
}

function buscarManual(){
    const t = document.getElementById('buscarManual').value.toUpperCase().trim();
    const div = document.getElementById('resultadosManual');
    div.innerHTML = '';

    if(t.length<2) return;

    clientes.filter(c =>
        c.nombre.toUpperCase().includes(t) ||
        c.apellido.toUpperCase().includes(t) ||
        c.codigo.includes(t)
    ).forEach(c=>{
        const b = document.createElement('button');
        b.textContent = `${c.codigo} - ${c.apellido}, ${c.nombre} (${c.puntos} pts)`;
        b.onclick = ()=>abrirDetalle(c);
        div.appendChild(b);
    });
}

function iniciarEscaner(){
    detenerEscaner();

    scannerActivo = new Html5Qrcode("reader");

    scannerActivo.start(
        { facingMode: "environment" },
        { fps:10, qrbox:250 },
        (decodedText)=>{
            let codigo = decodedText.split('-').pop().trim().toUpperCase();
            const encontrado = clientes.find(c=>c.codigo===codigo);

            if(encontrado){
                detenerEscaner();
                abrirDetalle(encontrado);
                alert("✅ Cliente detectado: "+encontrado.nombre);
            }
        },
        (err)=>{}
    );
}

function detenerEscaner(){
    if(scannerActivo){
        scannerActivo.stop().then(()=>{scannerActivo.clear();}).catch(()=>{});
        scannerActivo = null;
    }
}

window.onclick = function(e){
    if(e.target === document.getElementById('modalDetalle')){
        cerrarModal();
    }
}

</script>
</body>
</html>
